[package]
name = "fetch"
version = "2.3.0"
edition = "2021"
rust-version = "1.82"
description = "A donut.c-inspired fetch tool that spins your distro logo in 3D with live-updating system info"
license = "ISC"
readme = "README.md"

[[bin]]
name = "fetch"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
